# Chạy toàn bộ hệ thống trên máy cá nhân:  docker compose up --build
# Lần đầu mất vài phút vì image ai-service tải sẵn model CLIP (~1GB).
name: ttnt

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ttnt-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ttnt}
      POSTGRES_USER: ${POSTGRES_USER:-ttnt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ttnt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # chỉ mở cho máy bạn, để dùng DBeaver/psql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ai-service:
    build: ./ai_service
    container_name: ttnt-ai
    ports:
      - "127.0.0.1:8000:8000" # xem tài liệu API tại http://localhost:8000/docs
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ttnt-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      DATABASE_URL: postgres://${POSTGRES_USER:-ttnt}:${POSTGRES_PASSWORD:-ttnt}@postgres:5432/${POSTGRES_DB:-ttnt}
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      RUN_MIGRATIONS: "true"
      IMPORT_CSV_ON_START: "true"
      TRUST_PROXY: 1 # phía trước có nginx của container frontend
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started # backend vẫn chạy được khi AI đang nạp model (tự hạ cấp xuống tìm từ khóa)
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ttnt-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
