server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cho phép tải ảnh lên (backend giới hạn 5MB mặc định).
  client_max_body_size 6m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Phân giải DNS của Docker lúc có request, nhờ đó nginx vẫn khởi động được khi backend chưa lên.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $upstream http://backend:3000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # File build có hash trong tên nên cache vĩnh viễn được.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: mọi đường dẫn khác trả về index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
