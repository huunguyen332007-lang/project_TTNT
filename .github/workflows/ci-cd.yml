name: CI/CD

# Feature/dev branches and PRs run CI only. A successful push to main builds the three images and
# pushes them to Docker Hub (tags: latest + sha-<commit>), then triggers the Render deploy hooks.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub username (namespace the images are pushed to)
#   DOCKERHUB_TOKEN     Docker Hub Access Token with "Read & Write" permission (NOT the account password)
#   RENDER_BACKEND_DEPLOY_HOOK_URL / RENDER_FRONTEND_DEPLOY_HOOK_URL  (for the deploy-render job)
on:
  push:
    branches: [main, dev, feature, "feature/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Python backend (tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ttnt_test
          POSTGRES_USER: ttnt
          POSTGRES_PASSWORD: ttnt_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttnt -d ttnt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://ttnt:ttnt_test_password@localhost:5432/ttnt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q app
      - name: Run unit, API and PostgreSQL integration tests
        run: pytest -q

  frontend:
    name: Frontend (tests & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: node --test "tests/**/*.test.mjs"
      - name: Build
        run: npm run build

  ai-service:
    name: AI service (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_service/requirements-*.txt
      # requirements-dev không cài torch/model; API được test với embedder giả.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local Compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate development override
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ADMIN_API_KEY: ci-admin-key-0123456789
          DOCKERHUB_USERNAME: ci-owner
        run: docker compose -f docker-compose.prod.yml config --quiet

  publish:
    name: Build & push image to Docker Hub (${{ matrix.name }})
    needs: [backend, frontend, ai-service, compose]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: backend, context: backend }
          - { name: frontend, context: frontend }
          - { name: ai-service, context: ai_service }
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Missing secret DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Missing secret DOCKERHUB_TOKEN"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ttnt-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Uncomment for an ARM production host: platforms: linux/amd64,linux/arm64

  deploy-render:
    name: Deploy to Render
    needs: [backend, frontend, ai-service, compose]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate Render secrets
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
          FRONTEND_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          test -n "$BACKEND_URL" || {
            echo "Missing RENDER_BACKEND_DEPLOY_HOOK_URL"
            exit 1
          }
          test -n "$FRONTEND_URL" || {
            echo "Missing RENDER_FRONTEND_DEPLOY_HOOK_URL"
            exit 1
          }

      - name: Deploy Backend
        env:
          DEPLOY_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            -G --data-urlencode "ref=${GITHUB_SHA}" \
            "$DEPLOY_URL"

      - name: Deploy Frontend
        env:
          DEPLOY_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            -G --data-urlencode "ref=${GITHUB_SHA}" \
            "$DEPLOY_URL"
