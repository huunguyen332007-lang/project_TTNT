name: CI/CD

# Quy ước nhánh của nhóm: làm ở feature -> push dev -> merge main.
#  - Mọi push/PR:        chạy test và build (CI)
#  - Push vào main:      build image, đẩy lên GHCR, tự triển khai lên server (CD)
on:
  push:
    branches: [main, dev, feature, "feature/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Push mới vào cùng nhánh sẽ hủy lượt chạy cũ; riêng main không bao giờ bị hủy giữa chừng khi đang deploy.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài dependency
        run: |
          if ! npm ci; then
            echo "::warning::package-lock.json thiếu hoặc lệch package.json, dùng npm install. Hãy chạy npm install và commit lockfile mới."
            npm install
          fi
      - name: Chạy test
        run: npm test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài dependency
        run: |
          if ! npm ci; then
            echo "::warning::package-lock.json thiếu hoặc lệch package.json, dùng npm install. Hãy chạy npm install và commit lockfile mới."
            npm install
          fi
      - name: Build
        run: npm run build

  ai-service:
    name: AI service (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_service/requirements-*.txt
      # Dùng requirements-dev (không có torch/model) nên bước này chỉ mất vài giây.
      - name: Cài dependency
        run: pip install -r requirements-dev.txt
      - name: Chạy test
        run: pytest -q

  compose:
    name: Kiểm tra cấu hình Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
      - name: docker-compose.prod.yml
        env:
          POSTGRES_PASSWORD: ci-password
          ADMIN_API_KEY: ci-admin-key-0123456789
          GHCR_OWNER: ci-owner
        run: docker compose -f docker-compose.prod.yml config --quiet

  publish:
    name: Build & đẩy image (${{ matrix.name }})
    needs: [backend, frontend, ai-service, compose]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: backend, context: backend }
          - { name: frontend, context: frontend }
          - { name: ai-service, context: ai_service }
    steps:
      - uses: actions/checkout@v4
      - name: Chuẩn hóa tên chủ sở hữu (GHCR yêu cầu chữ thường)
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/ttnt-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Server ARM (ví dụ Oracle Ampere) cần thêm:  platforms: linux/amd64,linux/arm64

  deploy:
    name: Triển khai lên server
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Tạo environment "production" trong Settings > Environments nếu muốn bắt buộc có người duyệt trước khi deploy.
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/ttnt' }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Cấu hình SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Gửi file cấu hình lên server
        run: |
          SSH="ssh -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST"
          $SSH "mkdir -p '$DEPLOY_PATH'"
          scp -P "$DEPLOY_PORT" docker-compose.prod.yml deploy/Caddyfile deploy/backup.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Kéo image mới và khởi động lại
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SSH="ssh -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST"
          # GITHUB_TOKEN chỉ sống trong lượt chạy này nên không để lộ lâu dài trên server.
          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '$ACTOR' --password-stdin"
          $SSH "cd '$DEPLOY_PATH' && export GHCR_OWNER='$OWNER' IMAGE_TAG='$IMAGE_TAG' \
            && docker compose -f docker-compose.prod.yml pull \
            && docker compose -f docker-compose.prod.yml up -d --remove-orphans \
            && docker image prune -f"

      - name: Chờ backend khỏe mạnh
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' ttnt-backend 2>/dev/null || echo none)
            if [ "$status" = healthy ]; then echo "Backend đã sẵn sàng."; exit 0; fi
            sleep 5
          done
          echo "Backend không khỏe mạnh sau 5 phút. Log gần nhất:"
          docker logs --tail 80 ttnt-backend
          exit 1
          REMOTE
